[pytest]
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests (fast, no server needed)
    integration: Integration tests (requires FastAPI running)
    e2e: End-to-end tests (requires full stack + browser)
    slow: Slow tests (skipped by default in CI quick runs)

addopts =
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=html:reports/coverage_html
    --cov-report=xml:reports/coverage.xml
    --cov-report=term-missing
    --cov-fail-under=70
    --html=reports/test_report.html
    --self-contained-html

asyncio_mode = auto
