version: "3.9"

services:

  # ── FastAPI backend ──────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: agrismart-api:latest
    container_name: agrismart_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./users.json:/app/users.json
      - ./predictions.log:/app/predictions.log
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Streamlit UI ─────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: agrismart-streamlit:latest
    container_name: agrismart_streamlit
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_API_URL=http://api:8000
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./users.json:/app/users.json
    command: >
      python -m streamlit run streamlit_app/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend static server ───────────────────
  frontend:
    image: nginx:alpine
    container_name: agrismart_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped

  # ── Jenkins CI/CD ────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: agrismart_jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

  # ── Selenium (E2E browser) ───────────────────
  selenium:
    image: selenium/standalone-chrome:latest
    container_name: agrismart_selenium
    ports:
      - "4444:4444"
    shm_size: 2gb
    restart: unless-stopped

volumes:
  jenkins_home:
