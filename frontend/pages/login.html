<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — AgriSmart AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <div class="login-logo-icon">🌱</div>
      <div class="login-logo-text">
        <h2>AgriSmart AI</h2>
        <p>Decision support for farms</p>
      </div>
    </div>

    <p class="login-title">Welcome back</p>
    <p class="login-sub">Sign in to access the platform</p>

    <!-- API status -->
    <div id="api-status" style="display:none;margin-bottom:.7rem;font-size:.82rem;text-align:center"></div>

    <!-- Error message -->
    <div id="login-error" class="login-error" style="display:none"></div>

    <!-- Form -->
    <form class="login-form" id="login-form" novalidate>
      <div class="form-group">
        <label class="login-field-label" for="username">👤 Username</label>
        <input class="login-input" type="text" id="username"
               placeholder="Enter your username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="login-field-label" for="password">🔒 Password</label>
        <input class="login-input" type="password" id="password"
               placeholder="Enter your password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="login-btn">
        Sign In →
      </button>
    </form>

    <!-- Demo credentials hint -->
    <div class="login-hint">
      <strong>Demo credentials</strong>
      <div class="login-creds">
        <span class="login-cred-pill">admin / admin123</span>
        <span class="login-cred-pill">farmer / farmer123</span>
        <span class="login-cred-pill">demo / demo123</span>
      </div>
    </div>

  </div>
</div>

<script src="../js/auth.js"></script>
<script>
  /* Redirect if already logged in */
  if (Auth.isAuthenticated()) {
    window.location.href = 'overview.html';
  }

  /* Check API is reachable */
  fetch('http://localhost:8000/api/health')
    .then(r => r.json())
    .then(d => {
      const el = document.getElementById('api-status');
      el.style.display = 'block';
      el.style.color = '#2e7d32';
      el.textContent = '✓ API online — all models loaded';
    })
    .catch(() => {
      const el = document.getElementById('api-status');
      el.style.display = 'block';
      el.style.color = '#c0392b';
      el.textContent = '⚠ API offline — start with: python -m uvicorn app.main:app --port 8000';
    });

  const form  = document.getElementById('login-form');
  const errEl = document.getElementById('login-error');
  const btn   = document.getElementById('login-btn');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errEl.style.display = 'none';
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in…';

    const result = await Auth.login(username, password);

    if (result.ok) {
      window.location.href = 'overview.html';
    } else {
      errEl.textContent = '❌  ' + result.error;
      errEl.style.display = 'flex';
      btn.disabled = false;
      btn.textContent = 'Sign In →';
    }
  });
</script>
</body>
</html>
