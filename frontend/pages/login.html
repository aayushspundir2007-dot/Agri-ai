<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — AgriSmart AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <div class="login-logo-icon">🌱</div>
      <div class="login-logo-text">
        <h2>AgriSmart AI</h2>
        <p>Decision support for farms</p>
      </div>
    </div>

    <p class="login-title">Welcome back</p>
    <p class="login-sub">Sign in to access the platform</p>

    <!-- Error message -->
    <div id="login-error" class="login-error" style="display:none"></div>

    <!-- Form -->
    <form class="login-form" id="login-form" novalidate>
      <div class="form-group">
        <label class="login-field-label" for="username">👤 Username</label>
        <input class="login-input" type="text" id="username"
               placeholder="Enter your username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="login-field-label" for="password">🔒 Password</label>
        <input class="login-input" type="password" id="password"
               placeholder="Enter your password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="login-btn">
        Sign In →
      </button>
    </form>

    <!-- Demo credentials hint -->
    <div class="login-hint">
      <strong>Demo credentials</strong>
      <div class="login-creds">
        <span class="login-cred-pill">admin / admin123</span>
        <span class="login-cred-pill">farmer / farmer123</span>
        <span class="login-cred-pill">demo / demo123</span>
      </div>
    </div>

  </div>
</div>

<script src="../js/auth.js"></script>
<script>
/* Embedded user store — mirrors users.json hashes */
const USERS = {
  "admin":  { password: "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9", role: "admin",  name: "Admin User"  },
  "farmer": { password: "26c07fc7be1668f8ea7e3801d4ffdbf33de487a593a69028936ec49f2c89f6ab", role: "viewer", name: "Farm User"   },
  "demo":   { password: "d3ad9315b7be5dd53b31a273b3b3aba5defe700808305aa16a3062b76658a791", role: "viewer", name: "Demo Guest"  }
};

/* If already logged in, skip to app */
if (Auth.isAuthenticated()) {
  window.location.href = 'overview.html';
}

const form   = document.getElementById('login-form');
const errEl  = document.getElementById('login-error');
const btn    = document.getElementById('login-btn');

function showError(msg) {
  errEl.textContent = '❌  ' + msg;
  errEl.style.display = 'flex';
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  errEl.style.display = 'none';
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Signing in…';

  const result = await Auth.login(username, password, USERS);

  if (result.ok) {
    window.location.href = 'overview.html';
  } else {
    showError(result.error);
    btn.disabled = false;
    btn.textContent = 'Sign In →';
  }
});
</script>
</body>
</html>
